title: ES-DE Overlay
description: An in-game menu for ES-DE on Android, drawn in your ES-DE theme's look.
baseurl: /es-de-overlay
url: https://clintonium-119.github.io
# The layout's {% seo %} tag; minima used to switch this plugin on.
plugins:
  - jekyll-seo-tag
# Developer test notes stay in the repository, off the site.
exclude:
  - VERIFIED.md
# The sidebar on every page but the home page, in groups.
nav:
  - title: Get started
    pages: [setup.md, shizuku.md]
  - title: Using it
    pages: [use.md, guides.md]
  - title: Customise
    pages: [theme.md]
  - title: Help and reference
    pages: [troubleshooting.md, limitations.md, privacy.md, credits.md]
# Each page's first heading is its title, shown once.
titles_from_headings:
  strip_title: true
# The site's own layout (_layouts/default.html) frames every page.
defaults:
  - scope:
      path: ""
    values:
      layout: default
