name: Bug report
description: Something in the overlay doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Retroid Pocket Nova
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "13"
    validations:
      required: true
  - type: input
    id: esde
    attributes:
      label: ES-DE version
      description: From ES-DE's main menu.
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme and variant
      placeholder: Linear, Dark
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Emulator or game
      placeholder: RetroArch (mGBA), Pokémon Emerald
    validations:
      required: true
  - type: input
    id: overlay
    attributes:
      label: Overlay version
      description: Shown in Obtainium, or in Android's Settings > Apps > ES-DE Overlay. Leave blank if you're not sure.
      placeholder: 1.1.0
  - type: dropdown
    id: shizuku
    attributes:
      label: Shizuku in use
      options:
        - "No"
        - Shizuku
        - Shizuku-Next
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Launch a game from ES-DE
        2. Open the menu
        3. ...
    validations:
      required: true
  - type: textarea
    id: logcat
    attributes:
      label: Logcat excerpt
      description: "If you can connect a computer with adb: run `adb logcat -G 16M && adb logcat -s ESDEShot`, reproduce the problem, and paste the lines."
      render: text
