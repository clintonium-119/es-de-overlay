name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew testDebugUnitTest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Lint's security checks are fatal (app/lint.xml), so this fails on any of them.
      - run: ./gradlew lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  release:
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # For the build provenance attestation: a Sigstore certificate, and storing the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The notes start with the version's CHANGELOG.md section (a pre-release such as
      # v1.2.0-rc1 takes 1.2.0's). Without one, nothing is built or released.
      - run: |
          version=${GITHUB_REF_NAME#v}
          version=${version%%-*}
          awk -v v="$version" '/^## / { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # A variable, not a secret: it equals the repo name, which logs would otherwise mask.
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # The mv fails on an unsigned build (app-release-unsigned.apk), so nothing unsigned is released.
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
          apk="es-de-overlay-${GITHUB_REF_NAME#v}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"
      - env:
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        # Fails unless the APK is signed with the release key: apksigner fails on an unsigned APK,
        # and the certificate must match the variable (empty if the variable is unset).
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs "$APK")
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$certs")
          want=${SIGNING_CERT_SHA256//:/}
          if [[ -z "$cert" || "$cert" != "${want,,}" ]]; then
            echo "::error::$APK is signed with certificate '$cert', not SIGNING_CERT_SHA256"
            exit 1
          fi
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.APK }}
      - env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # The attestation is a Sigstore bundle, attached under that name. A tag with a suffix
        # (v1.1.0-beta) is a pre-release.
        run: |
          cp "$BUNDLE" "$APK.sigstore.json"
          cat >> notes.md <<EOF

          ### Check the download

          SHA-256:

              $(sha256sum "$APK")

          Signing certificate SHA-256:

              $CERT_SHA256

          To check that this APK was built by this repository's release workflow from $GITHUB_REF_NAME:

              gh attestation verify $APK --repo $GITHUB_REPOSITORY
          EOF
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=--prerelease
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sigstore.json" \
            --notes-file notes.md --verify-tag $pre
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
